# Type check and the checks that need no database, on every push and pull request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx scripts/checks/recurrence.ts
      - run: npx tsx scripts/checks/formatting.ts
      - run: npx tsx scripts/checks/private-address.ts
      - run: npx tsx scripts/checks/mailing.ts
