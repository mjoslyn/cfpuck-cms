# Builds docs-site/ (Starlight) and publishes it to GitHub Pages when the docs change on main.
name: Docs

on:
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Sites carry this file from the core; only the core publishes the docs.
    if: github.repository == 'mjoslyn/cfpuck-cms'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      # Only docs-site/: the root tsconfig.json extends astro/tsconfigs/strict, which the docs build
      # would resolve without the core's packages installed.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /docs-site/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
